<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICV Interactive — Global Header 1 (HTML Web Object)</title>
  <link rel="stylesheet" href="header1.css">
</head>
<body>
  <header class="dicv-h1" id="dicv-header1" role="banner" aria-label="Course global header">
    <div class="dicv-h1-left">
      <div class="dicv-h1-brand" role="img" aria-label="Daimler Truck EHS Refresher Training">
        <img class="dicv-dt-logo" src="Daimler_Truck_Logotype_1L_White_RGB.png" alt="Daimler Truck" />
        <span class="dicv-brand-sep" aria-hidden="true"></span>
        <span class="dicv-h1-title">EHS Refresher Training</span>
      </div>
    </div>

    <div class="dicv-h1-center" id="h1-indicators">
      <div class="dicv-h1-stat dicv-h1-life" id="h1-life" role="status" aria-live="polite" aria-label="Lives unavailable">
        <span class="dicv-hearts" id="h1-hearts" aria-hidden="true">
          <svg class="dicv-ico dicv-heart is-unavailable" data-heart="1" viewBox="0 0 24 24">
            <path d="M12 21s-7.2-4.6-9.6-9.1C.7 8.6 2.3 4.8 5.9 4.1c2.1-.4 4.2.5 5.4 2.1 1.2-1.6 3.3-2.5 5.4-2.1 3.6.7 5.2 4.5 3.5 7.8C19.2 16.4 12 21 12 21z"/>
          </svg>
          <svg class="dicv-ico dicv-heart is-unavailable" data-heart="2" viewBox="0 0 24 24">
            <path d="M12 21s-7.2-4.6-9.6-9.1C.7 8.6 2.3 4.8 5.9 4.1c2.1-.4 4.2.5 5.4 2.1 1.2-1.6 3.3-2.5 5.4-2.1 3.6.7 5.2 4.5 3.5 7.8C19.2 16.4 12 21 12 21z"/>
          </svg>
          <svg class="dicv-ico dicv-heart is-unavailable" data-heart="3" viewBox="0 0 24 24">
            <path d="M12 21s-7.2-4.6-9.6-9.1C.7 8.6 2.3 4.8 5.9 4.1c2.1-.4 4.2.5 5.4 2.1 1.2-1.6 3.3-2.5 5.4-2.1 3.6.7 5.2 4.5 3.5 7.8C19.2 16.4 12 21 12 21z"/>
          </svg>
        </span>
        <span class="dicv-stat-val dicv-life-val" id="h1-life-val">--</span>
      </div>

      <span class="dicv-center-sep" id="h1-center-sep" aria-hidden="true"></span>

      <div class="dicv-h1-stat dicv-h1-stars" id="h1-stars" role="status" aria-live="polite" aria-label="0 of 6 module stars earned">
        <span class="dicv-stars" id="h1-stars-icons" aria-hidden="true">
          <svg class="dicv-ico dicv-star is-inactive" data-star="1" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>
          <svg class="dicv-ico dicv-star is-inactive" data-star="2" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>
          <svg class="dicv-ico dicv-star is-inactive" data-star="3" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>
          <svg class="dicv-ico dicv-star is-inactive" data-star="4" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>
          <svg class="dicv-ico dicv-star is-inactive" data-star="5" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>
          <svg class="dicv-ico dicv-star is-inactive" data-star="6" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg>
        </span>
        <span class="dicv-stat-val dicv-stars-val" id="h1-stars-val">0/6</span>
      </div>
    </div>

    <nav class="dicv-h1-actions" aria-label="Global course controls">
      <button type="button" class="dicv-h1-btn" id="btn-guidelines" data-action="OPEN_GUIDELINES" aria-label="Open Mission Guidelines" title="Mission Guidelines">
        <svg class="dicv-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
        <span class="dicv-btn-lbl">Guidelines</span>
      </button>

      <button type="button" class="dicv-h1-btn" id="btn-map" data-action="OPEN_MAP" aria-label="Open Course Map" title="Course Map">
        <svg class="dicv-ico" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
        <span class="dicv-btn-lbl">Map</span>
      </button>

      <button type="button" class="dicv-h1-btn" id="btn-mute" data-action="TOGGLE_MUTE" aria-label="Mute audio" aria-pressed="false" title="Mute / Unmute">
        <svg class="dicv-ico ico-unmuted" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
        <svg class="dicv-ico ico-muted is-hidden" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="22" y1="9" x2="16" y2="15"/>
          <line x1="16" y1="9" x2="22" y2="15"/>
        </svg>
        <span class="dicv-btn-lbl">Mute</span>
      </button>

      <button type="button" class="dicv-h1-btn" id="btn-fullscreen" data-action="TOGGLE_FULLSCREEN" aria-label="Toggle fullscreen" aria-pressed="false" title="Fullscreen">
        <svg class="dicv-ico" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        <span class="dicv-btn-lbl">Fullscreen</span>
      </button>
    </nav>
  </header>

  <script src="sfx.js"></script>
  <script src="header1.js"></script>
</body>
</html>
