<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 1 Intro — DICV Safety Culture &amp; Vision Zero | DICV Interactive</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root {
      --petrol-dark: #004355;
      --petrol: #00677F;
      --yellow: #FFFF40;
      --green: #008248;
      --text-dark: #162229;
      --text-muted: #4B5D66;
      --font-family: "Daimler CS", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #061821;
      font-family: var(--font-family);
      overflow: hidden;
      position: relative;
    }

    /* 1920x1080 Auto-Scaled Stage matching CourseMap exact conveyor geometry */
    .stage-1920 {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      overflow: hidden;
    }

    .factory-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.78) saturate(1.08);
      animation: bgFadeIn 0.7s ease-out backwards;
      pointer-events: none;
    }

    .conveyor-belt-section {
      position: absolute;
      left: 0;
      bottom: -24px;
      width: 1920px;
      height: 540px;
      transform: scale(1.10);
      transform-origin: center bottom;
      pointer-events: none;
      animation: conveyorSlideIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.1s backwards;
    }

    .conveyor-assembly {
      position: relative;
      width: 1920px;
      height: 540px;
    }

    .conveyor-chassis {
      position: absolute;
      left: -18px;
      bottom: 0;
      width: 1956px;
      height: 343px;
      display: block;
    }

    .station {
      position: absolute;
      transform: translateX(-50%);
      width: 248px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .station-callout {
      background: rgba(255, 255, 255, 0.96);
      color: var(--petrol-dark);
      border: 2px solid var(--yellow);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
      white-space: nowrap;
    }

    .station-badge-wrap {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .station-badge {
      width: 92px;
      height: 92px;
      object-fit: contain;
    }

    .station-pad {
      position: relative;
      z-index: 1;
      width: 156px;
      height: 70px;
      object-fit: contain;
      margin-top: -16px;
    }

    .station-lock {
      position: absolute;
      top: -2px;
      right: -4px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #6E7E85;
      border: 2.5px solid #FFFFFF;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .station-lock svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Active Block 1 */
    .station.is-active {
      animation: blockPowerUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s backwards;
    }

    .station.is-active .station-badge-wrap {
      transform: translateY(-4px) scale(1.06);
      filter: drop-shadow(0 0 18px rgba(0, 210, 255, 0.9)) drop-shadow(0 0 10px rgba(255, 255, 64, 0.75));
      animation: badgeFloat 2.8s ease-in-out infinite;
    }

    .station.is-active .station-pad {
      filter: drop-shadow(0 0 16px rgba(0, 210, 255, 0.8));
    }

    /* Locked Blocks 2-6 */
    .station.is-locked .station-badge-wrap {
      transform: translateY(4px) scale(0.96);
      opacity: 0.9;
    }

    .station.is-locked .station-pad {
      transform: scale(0.96);
      filter: saturate(0) contrast(1.06) brightness(0.94);
      opacity: 0.94;
    }

    @keyframes bgFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes conveyorSlideIn {
      from { opacity: 0; transform: scale(1.10) translateY(40px); }
      to   { opacity: 1; transform: scale(1.10) translateY(0); }
    }

    @keyframes blockPowerUp {
      from { opacity: 0; transform: translateX(-50%) translateY(18px) scale(0.9); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes badgeFloat {
      0%, 100% { transform: translateY(-4px) scale(1.06); }
      50% { transform: translateY(-10px) scale(1.06); }
    }

    /* Foreground Intro Card positioned comfortably below Header 1/2 and above all 6 conveyor stations */
    .intro-wrap {
      position: absolute;
      top: 138px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .intro-card {
      width: 1120px;
      background: rgba(255, 255, 255, 0.98);
      border: 2px solid var(--petrol-dark);
      border-radius: 26px;
      box-shadow: 0 24px 64px rgba(0, 20, 32, 0.48);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      animation: cardFadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.45s backwards;
    }

    @keyframes cardFadeUp {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes lineSweep {
      from { width: 0%; }
      to   { width: 100%; }
    }

    @keyframes stepPop {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero-banner {
      background: linear-gradient(135deg, #003545 0%, var(--petrol-dark) 55%, var(--petrol) 100%);
      border-bottom: 5px solid var(--yellow);
      padding: 22px 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: #FFFFFF;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .module-icon-badge {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--petrol-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .hero-eyebrow {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: var(--yellow);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .hero-title {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;
    }

    .lives-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .lives-hearts {
      display: inline-flex;
      gap: 4px;
    }

    .lives-hearts svg {
      width: 18px;
      height: 18px;
      fill: #FF4D4F;
    }

    .roadmap-body {
      padding: 22px 34px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .roadmap-heading {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: var(--petrol-dark);
    }

    .roadmap-track-wrap {
      position: relative;
      padding-top: 6px;
    }

    .roadmap-line-bg {
      position: absolute;
      top: 24px;
      left: 60px;
      right: 60px;
      height: 4px;
      background: #DCE8EC;
      border-radius: 2px;
      z-index: 1;
    }

    .roadmap-line-fill {
      height: 100%;
      width: 100%;
      background: var(--petrol);
      border-radius: 2px;
      animation: lineSweep 0.75s ease-out 0.65s backwards;
    }

    .roadmap-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .roadmap-item {
      background: #F8FBFC;
      border: 1.5px solid #CFE1E7;
      border-radius: 16px;
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      animation: stepPop 0.38s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .roadmap-item:nth-child(1) { animation-delay: 0.60s; border-color: var(--petrol); background: #EFF7FA; }
    .roadmap-item:nth-child(2) { animation-delay: 0.69s; }
    .roadmap-item:nth-child(3) { animation-delay: 0.78s; }
    .roadmap-item:nth-child(4) { animation-delay: 0.87s; }
    .roadmap-item:nth-child(5) { animation-delay: 0.96s; }

    .roadmap-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--petrol-dark);
      color: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      border: 3px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 67, 85, 0.25);
    }

    .roadmap-item strong {
      font-size: 16px;
      font-weight: 700;
      color: var(--petrol-dark);
      line-height: 1.2;
    }

    .roadmap-item span {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .intro-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding-top: 14px;
      border-top: 1px solid #E2ECEF;
    }

    .briefing-note {
      font-size: 17px;
      font-weight: 700;
      color: var(--petrol-dark);
      line-height: 1.35;
      max-width: 640px;
    }

    .btn-start {
      height: 54px;
      padding: 0 32px;
      border-radius: 27px;
      border: 2.5px solid var(--petrol-dark);
      background: var(--yellow);
      color: var(--petrol-dark);
      font-family: var(--font-family);
      font-size: 20px;
      font-weight: 700;
      font-style: normal;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 67, 85, 0.24);
      transition: all 0.16s ease;
    }

    .btn-start:hover {
      background: #FFF91A;
      transform: translateY(-2px);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    html.no-animation *,
    html.no-animation *::before,
    html.no-animation *::after {
      animation: none !important;
      transition: none !important;
    }
  </style>
</head>
<body>
  <div class="stage-1920" id="stage-1920">
    <img class="factory-bg" src="assets/map-bg.jpg" alt="" aria-hidden="true">

    <!-- All 6 Conveyor Blocks Matching Exact CourseMap Alignment -->
    <section class="conveyor-belt-section" aria-hidden="true">
      <div class="conveyor-assembly">
        <img class="conveyor-chassis" src="assets/Full converyor belt latest.svg" alt="">

        <div class="station is-active" style="left: 13.8%; bottom: 144px;">
          <div class="station-callout">Module 1: Safety Culture</div>
          <div class="station-badge-wrap"><img class="station-badge" src="assets/Asset 6.svg" alt=""></div>
          <img class="station-pad" src="assets/Asset 7.svg" alt="">

          <div class="station-badge-wrap">
            <img class="station-badge" src="assets/Asset 5.svg" alt="">
            <span class="station-lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          </div>
          <img class="station-pad" src="assets/Asset 7.svg" alt="">
        </div>

        <div class="station is-locked" style="left: 42.6%; bottom: 202px;">
          <div class="station-badge-wrap">
            <img class="station-badge" src="assets/Asset 4.svg" alt="">
            <span class="station-lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          </div>
          <img class="station-pad" src="assets/Asset 7.svg" alt="">
        </div>

        <div class="station is-locked" style="left: 57.0%; bottom: 230px;">
          <div class="station-badge-wrap">
            <img class="station-badge" src="assets/Asset 1.svg" alt="">
            <span class="station-lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          </div>
          <img class="station-pad" src="assets/Asset 7.svg" alt="">
        </div>

        <div class="station is-locked" style="left: 71.4%; bottom: 259px;">
          <div class="station-badge-wrap">
            <img class="station-badge" src="assets/Asset 2.svg" alt="">
            <span class="station-lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          </div>
          <img class="station-pad" src="assets/Asset 7.svg" alt="">
        </div>

        <div class="station is-locked" style="left: 85.8%; bottom: 288px;">
          <div class="station-badge-wrap">
            <img class="station-badge" src="assets/Asset 3.svg" alt="">
            <span class="station-lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          </div>
          <img class="station-pad" src="assets/Asset 7.svg" alt="">
        </div>
      </div>
    </section>

    <main class="intro-wrap" role="region" aria-label="Module 1 Introduction">
      <section class="intro-card">
        <header class="hero-banner">
          <div class="hero-left">
            <div class="module-icon-badge" aria-hidden="true">1</div>
            <div>
              <div class="hero-eyebrow">Module 1 of 6 &#8226; Mission Briefing</div>
              <h1 class="hero-title">DICV Safety Culture &amp; Vision Zero</h1>
            </div>
          </div>

          <div class="lives-pill" aria-label="3 of 3 Life Hearts">
            <span class="lives-hearts" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </span>
            <span>3 / 3 Hearts</span>
          </div>
        </header>

        <section class="roadmap-body">
          <h2 class="roadmap-heading">Your 5-Topic Journey to Earn Star 1 of 6</h2>

          <div class="roadmap-track-wrap">
            <div class="roadmap-line-bg" aria-hidden="true">
              <div class="roadmap-line-fill"></div>
            </div>
            <div class="roadmap-grid">
              <div class="roadmap-item">
                <div class="roadmap-num">1</div>
                <strong>DICV's Commitment to a Safer Workplace</strong>
              </div>
              <div class="roadmap-item">
                <div class="roadmap-num">2</div>
                <strong>EHS Vision</strong>
              </div>
              <div class="roadmap-item">
                <div class="roadmap-num">3</div>
                <strong>Safety Strategy</strong>
              </div>
              <div class="roadmap-item">
                <div class="roadmap-num">4</div>
                <strong>Safety Culture</strong>
              </div>
              <div class="roadmap-item">
                <div class="roadmap-num">5</div>
                <strong>Safety Review Structure</strong>
              </div>
            </div>
          </div>

          <footer class="intro-footer">
            <button type="button" class="btn-start" id="btn-start" aria-label="Start Module 1">
              <span>Start Module 1</span>
              <span aria-hidden="true">&#10132;</span>
            </button>
          </footer>
        </section>
      </section>
    </main>
  </div>

  <script src="storyline-bridge.js"></script>
  <script>
    (function () {
      'use strict';

      function scaleStage() {
        var el = document.getElementById('stage-1920');
        if (!el) return;
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        el.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
      }
      window.addEventListener('resize', scaleStage);
      scaleStage();

      try {
        var params = new URLSearchParams(window.location.search || '');
        if (params.has('no_anim')) {
          document.documentElement.classList.add('no-animation');
        }
      } catch (e) {}

      var bridge = new DICVStorylineBridge({
        quizId: 'M1_Intro',
        storylineVariables: { submitted: 'M1_Intro_Done', correct: 'M1_Intro_Continue', revealed: 'M1_Intro_Done' }
      });

      var btnStart = document.getElementById('btn-start');
      if (btnStart) {
        btnStart.addEventListener('click', function () {
          var p = bridge && typeof bridge.getPlayer === 'function' ? bridge.getPlayer() : null;
          if (p && typeof p.SetVar === 'function') {
            try {
              var cur = typeof p.GetVar === 'function' ? p.GetVar('M1_Intro_Continue') : false;
              var isTrue = cur === true || cur === 'true' || cur === 1 || cur === '1';
              if (isTrue) {
                p.SetVar('M1_Intro_Continue', false);
                setTimeout(function () {
                  try { p.SetVar('M1_Intro_Continue', true); } catch (e2) {}
                }, 250);
              } else {
                p.SetVar('M1_Intro_Continue', true);
              }
            } catch (e) {}
          }
          if (bridge && typeof bridge.sendToParent === 'function') {
            bridge.sendToParent('MODULE1_INTRO_START', { timestamp: Date.now() });
          }
        });
      }
    })();
  </script>
</body>
</html>
