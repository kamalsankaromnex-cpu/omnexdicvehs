<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F9"/>
      <stop offset="100%" stop-color="#D0DEE5"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#79AEBF"/>
      <stop offset="100%" stop-color="#004355"/>
    </linearGradient>
    <linearGradient id="warn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFF40"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="580" height="300" rx="16" fill="url(#bg)"/>

  <!-- Shopfloor Grid Background Pattern -->
  <g opacity="0.15" stroke="#004355" stroke-width="1.5">
    <line x1="0" y1="230" x2="580" y2="230"/>
    <line x1="0" y1="260" x2="580" y2="260"/>
    <line x1="80" y1="230" x2="40" y2="300"/>
    <line x1="180" y1="230" x2="160" y2="300"/>
    <line x1="280" y1="230" x2="280" y2="300"/>
    <line x1="380" y1="230" x2="400" y2="300"/>
    <line x1="480" y1="230" x2="520" y2="300"/>
  </g>

  <!-- Industrial Machinery Chassis -->
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="220" height="170" rx="12" fill="url(#metal)"/>
    <rect x="90" y="80" width="180" height="90" rx="8" fill="#002833"/>
    <!-- Machine Status Screen -->
    <rect x="100" y="90" width="160" height="70" rx="6" fill="#001820"/>
    <path d="M 115 135 L 145 110 L 175 140 L 205 105 L 235 125" fill="none" stroke="#D92323" stroke-width="3" stroke-linecap="round"/>
    <circle cx="205" cy="105" r="4" fill="#D92323"/>

    <!-- Control Buttons -->
    <circle cx="115" cy="195" r="10" fill="#D92323"/>
    <circle cx="145" cy="195" r="10" fill="#FFFF40"/>
    <circle cx="175" cy="195" r="10" fill="#008248"/>
    <rect x="205" y="185" width="60" height="20" rx="4" fill="#5097AB"/>
  </g>

  <!-- Warning Triangle & Unresolved Alert -->
  <g transform="translate(330, 45)" filter="url(#shadow)">
    <!-- Warning Triangle -->
    <polygon points="110,15 15,190 205,190" fill="url(#warn)" stroke="#004355" stroke-width="8" stroke-linejoin="round"/>
    <!-- Exclamation Mark -->
    <rect x="102" y="70" width="16" height="65" rx="8" fill="#004355"/>
    <circle cx="110" cy="160" r="10" fill="#004355"/>
  </g>

  <!-- Industrial Gears Accent -->
  <g transform="translate(430, 160)" fill="#004355" opacity="0.85">
    <path d="M 50 20 L 58 20 L 60 28 L 68 31 L 75 25 L 81 31 L 76 38 L 79 46 L 87 48 L 87 56 L 79 58 L 76 66 L 81 73 L 75 79 L 68 73 L 60 76 L 58 84 L 50 84 L 48 76 L 40 73 L 33 79 L 27 73 L 32 66 L 29 58 L 21 56 L 21 48 L 29 46 L 32 38 L 27 31 L 33 25 L 40 31 L 48 28 Z"/>
    <circle cx="54" cy="52" r="14" fill="url(#bg)"/>
  </g>

  <!-- Status Banner: "SAFETY CRITICAL" -->
  <g transform="translate(140, 248)">
    <rect width="300" height="34" rx="8" fill="#D92323"/>
    <text x="150" y="23" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">CRITICAL SAFETY ISSUE</text>
  </g>
</svg>
