<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F9"/>
      <stop offset="100%" stop-color="#D0DEE5"/>
    </linearGradient>
    <linearGradient id="metal3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#79AEBF"/>
      <stop offset="100%" stop-color="#004355"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007A93"/>
      <stop offset="100%" stop-color="#004355"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="580" height="300" rx="16" fill="url(#bg3)"/>

  <!-- Machine Guard Barrier Frame (Left) -->
  <g transform="translate(60, 45)" filter="url(#shadow3)">
    <!-- Yellow Outer Safety Fence Frame -->
    <rect x="0" y="0" width="220" height="190" rx="10" fill="none" stroke="#FFFF40" stroke-width="12"/>
    <rect x="10" y="10" width="200" height="170" fill="none" stroke="#004355" stroke-width="4"/>
    
    <!-- Wire Mesh Barrier Grid -->
    <g stroke="#004355" stroke-width="2.5" opacity="0.6">
      <line x1="10" y1="40" x2="210" y2="40"/>
      <line x1="10" y1="70" x2="210" y2="70"/>
      <line x1="10" y1="100" x2="210" y2="100"/>
      <line x1="10" y1="130" x2="210" y2="130"/>
      <line x1="10" y1="160" x2="210" y2="160"/>

      <line x1="50" y1="10" x2="50" y2="180"/>
      <line x1="90" y1="10" x2="90" y2="180"/>
      <line x1="130" y1="10" x2="130" y2="180"/>
      <line x1="170" y1="10" x2="170" y2="180"/>
    </g>

    <!-- Safety Interlock Switch Device -->
    <rect x="185" y="80" width="26" height="40" rx="4" fill="#008248" stroke="#004355" stroke-width="2"/>
    <circle cx="198" cy="100" r="5" fill="#FFFF40"/>
  </g>

  <!-- Machine Guarding Shield & Checklist (Right) -->
  <g transform="translate(320, 45)" filter="url(#shadow3)">
    <!-- Safety Shield -->
    <path d="M 120 10 L 210 40 C 210 120 120 180 120 180 C 120 180 30 120 30 40 Z" fill="url(#shieldGrad)" stroke="#FFFF40" stroke-width="6"/>
    
    <!-- Interlock Checkmark inside Shield -->
    <path d="M 75 90 L 105 120 L 165 60" fill="none" stroke="#FFFF40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hard Hat Accent -->
  <g transform="translate(230, 160)" filter="url(#shadow3)">
    <path d="M 20 50 C 20 20 90 20 90 50 Z" fill="#FFFF40" stroke="#004355" stroke-width="3"/>
    <rect x="10" y="48" width="90" height="8" rx="4" fill="#FFFF40" stroke="#004355" stroke-width="3"/>
  </g>

  <!-- Status Banner: "MACHINE GUARDING" -->
  <g transform="translate(110, 248)">
    <rect width="360" height="34" rx="8" fill="#00677F"/>
    <text x="180" y="23" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MACHINE GUARDING IMPROVEMENT</text>
  </g>
</svg>
