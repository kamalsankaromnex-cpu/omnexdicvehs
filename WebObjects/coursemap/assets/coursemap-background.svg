<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7E2ED" />
      <stop offset="55%" stop-color="#EDF3F9" />
      <stop offset="100%" stop-color="#DFE8F2" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9D7E5" />
      <stop offset="30%" stop-color="#E2EBF3" />
      <stop offset="100%" stop-color="#EDF3F8" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9C8D7" />
      <stop offset="100%" stop-color="#DCE5EE" />
    </linearGradient>
    <linearGradient id="yellowStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6A800" />
      <stop offset="100%" stop-color="#FFD028" />
    </linearGradient>
  </defs>

  <!-- Back Wall & Floor -->
  <rect x="0" y="0" width="1920" height="720" fill="url(#wallGrad)" />
  <rect x="0" y="720" width="1920" height="360" fill="url(#floorGrad)" />

  <!-- Subtle Industrial Wall Panels -->
  <g opacity="0.16" stroke="#B6C6D6" stroke-width="2" fill="none">
    <rect x="460" y="130" width="240" height="440" rx="8" />
    <rect x="720" y="130" width="240" height="440" rx="8" />
    <rect x="980" y="130" width="240" height="440" rx="8" />
    <rect x="1240" y="130" width="240" height="440" rx="8" />
    <rect x="1500" y="130" width="220" height="440" rx="8" />
  </g>

  <!-- Upper-Left Angled Industrial Gantry Beam & Yellow Trim -->
  <polygon points="0,0 480,0 260,210 0,210" fill="url(#beamGrad)" opacity="0.92" />
  <polygon points="350,0 1920,0 1920,58 450,58" fill="#C7D4E2" opacity="0.7" />
  <polygon points="0,152 210,152 382,0 412,0 225,176 0,176" fill="url(#yellowStripe)" />

  <!-- Far-Right Vertical Glowing Cyan Light Strip -->
  <rect x="1768" y="45" width="14" height="510" rx="7" fill="#5FE3FF" opacity="0.22" />
  <rect x="1772" y="45" width="6" height="510" rx="3" fill="#E8FCFF" opacity="0.45" />

  <!-- Subtle Floor Reflection Band -->
  <ellipse cx="960" cy="870" rx="880" ry="70" fill="#B5CCE0" opacity="0.28" />
</svg>
